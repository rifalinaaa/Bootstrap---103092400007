
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ruang Baca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #FFC0DE;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #80426E;
            min-height: 50px;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: bold;
        }

        .navbar-nav .nav-link {
            color: white;
            font-size: 15px;
            padding-left: 6px;
            padding-right: 6px;
        }

        .login-card {
            width: 100%;
            max-width: 345px;
            border: none;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .login-card .card-body {
            padding: 20px 15px;
        }

        .login-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 15px;
        }

        .form-label {
            font-size: 12px;
            margin-bottom: 4px;
        }

        .form-control {
            font-size: 12px;
            padding: 5px 7px;
            border-radius: 4px;
        }

        .form-check {
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .form-check-input {
            width: 15px;
            height: 15px;
            margin-top: 5px;
        }

        .form-check-label {
            font-size: 12px;
            margin-left: 1px;
        }

        .btn-login {
            font-size: 12px;
            padding: 5px;
            border-radius: 3px;
            background-color: #80426E;
            border-color: #80426E;
        }

        .login-footer {
            background-color: #f8f9fa;
            padding: 12px;
            text-align: center;
        }

        .login-footer a {
            font-size: 12px;
            color: #80426E;
        }

        @media (max-width: 576px) {
            .login-card {
                max-width: 100%;
            }

            .login-card .card-body {
                padding: 20px;
            }

            .login-title {
                font-size: 20px;
            }

            .login-subtitle,
            .form-label,
            .form-check-label,
            .btn-login,
            .login-footer a {
                font-size: 12px;
            }

            .form-control {
                font-size: 14px;
                padding: 8px 10px;
            }

            .form-check-input {
                width: 14px;
                height: 14px;
            }

            .navbar-nav .nav-link {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand">
        <div class="container-fluid px-4 px-md-4">
            <a class="navbar-brand text-white" href="#">Ruang Baca</a>

            <ul class="navbar-nav ms-auto flex-row">
                <li class="nav-item">
                    <a class="nav-link" href="#">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Tentang</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Bantuan</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Login -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4
                        d-flex justify-content-center mt-4 mt-md-4">

                <div class="card login-card">
                    <div class="card-body">

                        <h1 class="login-title text-center">
                            Masuk ke Ruang Baca
                        </h1>

                        <p class="login-subtitle text-center">
                            Temukan bacaan untuk hari ini.
                        </p>

                        <form>
                            <div class="mb-2">
                                <label for="username" class="form-label">
                                    Username
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       placeholder="Masukkan username">
                            </div>

                            <div class="mb-2">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Masukkan password">
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="ingatSaya">
                                <label class="form-check-label"
                                       for="ingatSaya">
                                    Ingat saya
                                </label>
                            </div>

                            <button type="submit"
                                    class="btn btn-success btn-login w-100">
                                Masuk
                            </button>
                        </form>

                    </div>

                    <div class="card-footer login-footer">
                        <a href="#">Lupa password?</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
